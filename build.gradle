plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'edu.sc.seis.launch4j' version '3.0.5'
}

group = 'qa.cinema'
version = '1.0.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

compileJava.options.encoding   = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

repositories { mavenCentral() }

ext {
    junitVersion = '5.10.2'
    seleniumVersion = '4.23.0'
    appiumJavaClientVersion = '9.2.2'
    assertjVersion = '3.26.3'
    webDriverManagerVersion = '5.9.2'
}

dependencies {
    implementation "io.appium:java-client:${appiumJavaClientVersion}"
    implementation "org.json:json:20240303"

    // Necesario para compilar Main.java (menu launcher ejecutable)
    // JUnit Platform está en testImplementation pero Main.java vive en src/main/java
    implementation "org.junit.platform:junit-platform-launcher:1.10.2"
    implementation "org.junit.platform:junit-platform-engine:1.10.2"
    implementation "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:2.17.2"
    testImplementation "org.seleniumhq.selenium:selenium-java:${seleniumVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "io.qameta.allure:allure-junit5:2.29.0"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation "io.github.bonigarcia:webdrivermanager:${webDriverManagerVersion}"
    testImplementation "org.junit.platform:junit-platform-suite:1.10.2"
    testImplementation "org.junit.platform:junit-platform-launcher:1.10.2"
    testImplementation "ch.qos.logback:logback-classic:1.4.14"
    implementation "com.sun.mail:jakarta.mail:2.0.1"
    implementation "org.apache.pdfbox:pdfbox:2.0.28"
    implementation "com.formdev:flatlaf:3.4.1"
}

// ---------- ALLURE ----------
allure {
    version = '2.29.0'
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 { enabled = true }
        }
    }
}

test {
    useJUnitPlatform()
    systemProperties System.getProperties()
    systemProperty "SEND_PER_TEST", "false"
    // FIX real (robustez Unicode extremo a extremo — nombres de prueba con acentos/ñ en el
    // stdout que lee JobExecutor/TestRunnerService): Gradle ejecuta los tests en una JVM
    // forkeada aparte ("Gradle Test Executor") — systemProperties de arriba solo copia
    // valores de propiedades YA existentes, no cambia el charset con el que ESA JVM
    // arrancó. Se fija explícitamente para no depender del locale/file.encoding por
    // defecto de la máquina donde corra el Runner/backend (crítico en Windows, donde el
    // default de JDK 17 no es UTF-8).
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
        exceptionFormat "full"
    }

    // ✅ IMPORTANTE:
    // NO mandar correo desde Gradle.
    // El correo se manda SOLO desde JUnit Extension (PdfReportExtension/SuiteMailer)
    // cuando corres desde Android Studio.
}
// Fuerza recompilación completa en cada build (evita UP-TO-DATE con clases viejas)
tasks.named('compileJava')     { outputs.upToDateWhen { false } }
tasks.named('compileTestJava') { outputs.upToDateWhen { false } }

// ---------- FAT JAR EJECUTABLE ----------
shadowJar {
    archiveBaseName.set('cinepolis-tests')
    archiveClassifier.set('')
    archiveVersion.set('')

    manifest {
        attributes 'Main-Class': 'launcher.Main'
    }

    // Incluir clases del launcher (Main.java) y recursos de test
    from sourceSets.main.output
    from sourceSets.test.output

    // Incluir todas las dependencias (implementation + testImplementation)
    configurations = [project.configurations.testRuntimeClasspath]

    // Fusionar META-INF/services/ para que JUnit Engine y Allure listeners
    // se registren correctamente dentro del JAR
    mergeServiceFiles()

    // Excluir firmas digitales que rompen el JAR combinado
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'module-info.class'

    // ✅ Siempre reemplaza el JAR existente (nunca queda UP-TO-DATE)
    outputs.upToDateWhen { false }

    // ✅ Borra el JAR anterior antes de generar el nuevo
    doFirst {
        delete layout.buildDirectory.file('libs/cinepolis-tests.jar')
    }
}

// Copia appium.properties a build/libs/ junto al JAR
tasks.register('copyAppiumProps', Copy) {
    from 'src/test/resources/appium.properties'
    into layout.buildDirectory.dir('libs')
    // ✅ Siempre sobreescribe el archivo de configuración
    outputs.upToDateWhen { false }
}

// Tarea corta: .\gradlew.bat buildJar
// Actualiza JAR + config. El EXE stub (dontWrapJar) NO se reconstruye si ya existe —
// basta con actualizar el JAR porque el stub lo carga en cada ejecución.
// Para generar el EXE stub por primera vez (con el launcher cerrado): .\gradlew.bat buildDist
tasks.register('buildJar') {
    group = 'build'
    description = 'Regenera EXE (fat, JAR embebido) + config en build/launch4j/'
    dependsOn 'createExe'

    doLast {
        copy {
            from 'src/test/resources/appium.properties'
            into layout.buildDirectory.dir('launch4j')
        }
        copy {
            from 'src/test/resources/mexico-cinema.txt'
            into layout.buildDirectory.dir('launch4j')
        }

        println ""
        println "  =============================================="
        println "  Distribucion lista en build/launch4j/"
        println "  =============================================="
        println "    cinepolis-tests.exe     <- fat EXE (JAR embebido)"
        println "    appium.properties       <- config del dispositivo"
        println "    mexico-cinema.txt       <- cine por defecto Mexico"
        println "  =============================================="
        println ""
    }
}

// ---------- .EXE CON ÍCONO (Launch4j) ----------
launch4j {
    mainClassName = 'launcher.Main'
    outfile       = 'cinepolis-tests.exe'
    dontWrapJar   = false   // Fat EXE — JAR embebido dentro del EXE
    jreMinVersion = '17'
    headerType    = 'console'
}

tasks.named('createExe') {
    dependsOn shadowJar
    outputs.upToDateWhen { false }
    setJarTask(shadowJar)
}

// ✅ Genera distribución completa: .exe + .jar + appium.properties en build/launch4j/
tasks.register('buildDist') {
    group = 'build'
    description = 'Genera .exe con icono + JAR + config en build/launch4j/'
    dependsOn 'createExe'

    doLast {
        copy {
            from layout.buildDirectory.file('libs/cinepolis-tests.jar')
            into layout.buildDirectory.dir('launch4j')
        }
        // El EXE stub usa lib/cinepolis-tests.jar (ver createExe.xml)
        copy {
            from layout.buildDirectory.file('libs/cinepolis-tests.jar')
            into layout.buildDirectory.dir('launch4j/lib')
        }
        copy {
            from 'src/test/resources/appium.properties'
            into layout.buildDirectory.dir('launch4j')
        }
        copy {
            from 'src/test/resources/mexico-cinema.txt'
            into layout.buildDirectory.dir('launch4j')
        }

        println ""
        println "  =============================================="
        println "  Distribucion lista en build/launch4j/"
        println "  =============================================="
        println "    cinepolis-tests.exe     <- doble click (requiere Java 17+)"
        println "    lib/cinepolis-tests.jar <- cargado por el EXE"
        println "    appium.properties       <- editar con datos del dispositivo"
        println "    mexico-cinema.txt       <- cine por defecto México"
        println "  =============================================="
        println ""
    }
}

// ---------- RUNNER AGENT (Maven) ----------
// Recompila runner/target/cinepolis-runner.jar desde las fuentes Maven.
// Ejecutar: .\gradlew buildRunner
// Se ejecuta automáticamente como parte de buildDist.
tasks.register('buildRunner', Exec) {
    group = 'build'
    description = 'Recompila runner/target/cinepolis-runner.jar (Maven)'
    workingDir "$projectDir/runner"

    boolean isWindows = System.getProperty('os.name', '').toLowerCase().contains('win')
    commandLine isWindows
        ? ['cmd', '/c', 'mvn', '-q', 'clean', 'package', '-DskipTests']
        : ['mvn', '-q', 'clean', 'package', '-DskipTests']

    outputs.upToDateWhen { false }

    doLast {
        def jar = file("$projectDir/runner/target/cinepolis-runner.jar")
        println jar.exists()
            ? "  ✅ Runner JAR generado: runner/target/cinepolis-runner.jar (${jar.length() / 1024} KB)"
            : "  ❌ Runner JAR NO fue generado. Revisa runner/pom.xml"
    }
}

// Copia runner/target/cinepolis-runner.jar al classpath del backend para
// que /api/runner/download/jar pueda servirlo en desarrollo local.
// Ejecutar: .\gradlew deployRunner
tasks.register('deployRunner') {
    group = 'build'
    description = 'Compila el runner JAR y lo copia a backend/src/main/resources/installers/'
    dependsOn 'buildRunner'
    doLast {
        def src = file("$projectDir/runner/target/cinepolis-runner.jar")
        def dstDir = file("$projectDir/backend/src/main/resources/installers")
        if (!src.exists()) {
            throw new GradleException("runner/target/cinepolis-runner.jar no existe. Revisa runner/pom.xml")
        }
        copy {
            from src
            into dstDir
        }
        def dst = new File(dstDir, "cinepolis-runner.jar")
        println "  OK deployRunner: ${dst.absolutePath} (${src.length() / 1024} KB)"
        println "  Endpoint listo: GET /api/runner/download/jar"
    }
}

// ---------- RUNNER PARA ENVIAR CORREO DESDE CI ----------
tasks.register('runAllureMailRunner', JavaExec) {
    group = "reporting"
    description = "Envía correo final (HTML + PDF) desde CI"
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "utils.AllureMailRunner"
    systemProperties System.getProperties()
}

// ---------- DIAGNÓSTICO SMTP ----------
tasks.register('testEmail', JavaExec) {
    group = "reporting"
    description = "Prueba la conexión SMTP y envía un correo de prueba"
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "utils.EmailTester"
    systemProperties System.getProperties()
}

tasks.register('ciAllureEmail') {
    group = "reporting"
    description = "Tests + Allure Report + Email"
    dependsOn "test", "allureReport", "runAllureMailRunner"
}


