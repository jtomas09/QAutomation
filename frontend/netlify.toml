[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "https://qautomation-production.up.railway.app"

# Proxy /api/* → Railway (fallback si VITE_API_URL no está en el build)
[[redirects]]
  from   = "/api/*"
  to     = "https://qautomation-production.up.railway.app/api/:splat"
  status = 200
  force  = true

# SPA fallback (React Router)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
