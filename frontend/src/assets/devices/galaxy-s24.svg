<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" fill="none">
  <defs>
    <!-- Titanium armor frame -->
    <linearGradient id="s24-frame" x1="0" y1="0" x2="200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#c5c5c5"/>
      <stop offset="35%"  stop-color="#e8e8e8"/>
      <stop offset="65%"  stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
    <!-- Shadow black glass back -->
    <linearGradient id="s24-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#181a1d"/>
      <stop offset="100%" stop-color="#0d0f11"/>
    </linearGradient>
    <!-- Screen -->
    <linearGradient id="s24-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0b1018"/>
    </linearGradient>
    <linearGradient id="s24-reflect" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.07)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="s24-shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="rgba(20,184,166,0.3)" flood-opacity="1"/>
    </filter>
    <clipPath id="s24-screen-clip">
      <rect x="12" y="12" width="176" height="376" rx="20"/>
    </clipPath>
  </defs>

  <!-- Drop shadow glow -->
  <rect x="10" y="6" width="180" height="388" rx="34" fill="rgba(20,184,166,0.05)" filter="url(#s24-shadow)"/>

  <!-- Frame — ultra slim titanium -->
  <rect x="8" y="8" width="184" height="384" rx="34" fill="url(#s24-frame)"/>

  <!-- Glass back -->
  <rect x="10" y="10" width="180" height="380" rx="32" fill="url(#s24-back)"/>

  <!-- Screen bezel (very thin S24) -->
  <rect x="11" y="11" width="178" height="378" rx="30" fill="#111"/>

  <!-- Screen -->
  <rect x="12" y="12" width="176" height="376" rx="28" fill="url(#s24-screen)"/>
  <rect x="12" y="12" width="176" height="376" rx="28" fill="url(#s24-reflect)"/>

  <!-- Punch-hole selfie cam (center top) -->
  <circle cx="100" cy="32" r="6.5" fill="#000"/>
  <circle cx="100" cy="32" r="4.5" fill="#080808"/>
  <circle cx="98.5" cy="30.5" r="1.5" fill="rgba(255,255,255,0.14)"/>

  <!-- Status bar -->
  <rect x="20" y="26" width="22" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>

  <!-- Screen content: app icons row 1 -->
  <rect x="24" y="66" width="32" height="32" rx="9" fill="rgba(99,102,241,0.45)"/>
  <rect x="68" y="66" width="32" height="32" rx="9" fill="rgba(16,185,129,0.45)"/>
  <rect x="112" y="66" width="32" height="32" rx="9" fill="rgba(244,63,94,0.45)"/>
  <rect x="156" y="66" width="32" height="32" rx="9" fill="rgba(245,158,11,0.45)"/>

  <!-- App icons row 2 -->
  <rect x="24"  y="112" width="32" height="32" rx="9" fill="rgba(56,189,248,0.35)"/>
  <rect x="68"  y="112" width="32" height="32" rx="9" fill="rgba(124,58,237,0.35)"/>
  <rect x="112" y="112" width="32" height="32" rx="9" fill="rgba(249,115,22,0.35)"/>
  <rect x="156" y="112" width="32" height="32" rx="9" fill="rgba(20,184,166,0.35)"/>

  <!-- Samsung Widget -->
  <rect x="24" y="162" width="152" height="76" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <!-- Widget content -->
  <rect x="38" y="178" width="56" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="38" y="192" width="36" height="4" rx="2" fill="rgba(20,184,166,0.5)"/>
  <!-- Mini sparkline -->
  <polyline points="38,220 60,212 82,216 104,208 126,210 148,204 164,206"
    stroke="rgba(20,184,166,0.6)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="38,220 60,212 82,216 104,208 126,210 148,204 164,206 164,220"
    fill="rgba(20,184,166,0.08)" stroke="none"/>

  <!-- App icons row 3 -->
  <rect x="24"  y="258" width="32" height="32" rx="9" fill="rgba(234,67,53,0.3)"/>
  <rect x="68"  y="258" width="32" height="32" rx="9" fill="rgba(52,168,83,0.3)"/>
  <rect x="112" y="258" width="32" height="32" rx="9" fill="rgba(66,133,244,0.3)"/>
  <rect x="156" y="258" width="32" height="32" rx="9" fill="rgba(251,188,4,0.3)"/>

  <!-- Dock -->
  <rect x="24" y="310" width="152" height="48" rx="22" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="52"  cy="334" r="13" fill="rgba(99,102,241,0.5)"/>
  <circle cx="84"  cy="334" r="13" fill="rgba(16,185,129,0.5)"/>
  <circle cx="116" cy="334" r="13" fill="rgba(244,63,94,0.5)"/>
  <circle cx="148" cy="334" r="13" fill="rgba(56,189,248,0.5)"/>

  <!-- Home bar -->
  <rect x="76" y="370" width="48" height="4" rx="2" fill="rgba(255,255,255,0.25)"/>

  <!-- Contour cut camera housing (back) -->
  <rect x="148" y="20" width="34" height="60" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <!-- Camera 1 -->
  <circle cx="165" cy="36" r="10" fill="#090a0b" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <circle cx="165" cy="36" r="7"  fill="#050506"/>
  <circle cx="163" cy="34" r="2.5" fill="rgba(255,255,255,0.12)"/>
  <!-- Camera 2 -->
  <circle cx="165" cy="58" r="9"  fill="#090a0b" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <circle cx="165" cy="58" r="6"  fill="#050506"/>
  <circle cx="163" cy="56" r="2"  fill="rgba(255,255,255,0.1)"/>
  <!-- Flash -->
  <circle cx="155" cy="72" r="3.5" fill="#bfa020" opacity="0.6"/>

  <!-- Power button right -->
  <rect x="191" y="130" width="7" height="60" rx="3.5" fill="#c8c8c8"/>
  <rect x="192" y="131" width="3" height="58" rx="1.5" fill="rgba(255,255,255,0.25)"/>

  <!-- Volume buttons left -->
  <rect x="2" y="120" width="7" height="36" rx="3.5" fill="#c0c0c0"/>
  <rect x="3" y="121" width="3" height="34" rx="1.5" fill="rgba(255,255,255,0.2)"/>
  <rect x="2" y="166" width="7" height="36" rx="3.5" fill="#c0c0c0"/>
  <rect x="3" y="167" width="3" height="34" rx="1.5" fill="rgba(255,255,255,0.2)"/>

  <!-- USB-C -->
  <rect x="80" y="393" width="40" height="5" rx="2.5" fill="#a0a0a0"/>
  <rect x="82" y="394" width="36" height="3" rx="1.5" fill="#777"/>

  <!-- Neon border on screen -->
  <rect x="12" y="12" width="176" height="376" rx="28" fill="none" stroke="rgba(20,184,166,0.12)" stroke-width="1.5"/>

  <!-- Corner shine -->
  <path d="M38 12 Q12 12 12 38" stroke="rgba(255,255,255,0.25)" stroke-width="1" fill="none"/>
</svg>
