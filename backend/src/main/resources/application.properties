# Railway inyecta PORT automaticamente; fallback a 8080 en local
server.port=${PORT:8080}

# Forzar UTF-8 en request/response HTTP
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.mandatory-file-encoding=UTF-8

# CORS — origins permitidos (Netlify en prod, localhost en dev)
cinepolis.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,https://automationqa.netlify.app}

# Ruta al JAR de tests (puede sobreescribirse con variable de entorno)
cinepolis.tests.jar=${TESTS_JAR_PATH:../build/libs/cinepolis-tests.jar}

# appium.mode: local | browserstack | saucelabs
appium.mode=${APPIUM_MODE:local}
appium.hub=${APPIUM_HUB:http://127.0.0.1:4723/wd/hub}

# BrowserStack
browserstack.user=${BS_USER:}
browserstack.key=${BS_KEY:}
browserstack.app.id=${BS_APP_ID:}

# Sauce Labs
saucelabs.user=${SL_USER:}
saucelabs.key=${SL_KEY:}
saucelabs.app.id=${SL_APP_ID:}

# Video upload — allow large raw binary bodies (MP4 recordings)
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-swallow-size=-1
