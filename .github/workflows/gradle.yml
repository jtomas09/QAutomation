name: Gradle Tests
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build (device not available in CI, skip tests)
        run: |
          gradle wrapper
          ./gradlew -v
          ./gradlew -Dscan.tag=ci -x test build
